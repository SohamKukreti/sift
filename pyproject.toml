[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sift-crawl"
version = "0.1.0"
description = "Crawl a website and answer a question about it. Jev picks the relevant page, an LLM writes the answer."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "crawl4ai>=0.9.4",
    "pypdf",
    "python-dotenv",
    "requests",
]

[project.scripts]
sift = "sift.cli:main"
sift-setup = "sift.setup:main"

[tool.setuptools]
packages = ["sift"]
